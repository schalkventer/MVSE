<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SPA Without JavaScript — YouTube Thumbnail</title>
<style>
  @font-face { font-family: "Roboto"; font-weight: 900; font-style: italic; src: url("assets/fonts/roboto-latin-900-italic.woff2") format("woff2"); }
  @font-face { font-family: "Roboto"; font-weight: 900; font-style: normal; src: url("assets/fonts/roboto-latin-900-normal.woff2") format("woff2"); }
  @font-face { font-family: "Roboto"; font-weight: 700; font-style: normal; src: url("assets/fonts/roboto-latin-700-normal.woff2") format("woff2"); }
  @font-face { font-family: "JetBrains Mono"; font-weight: 700; src: url("assets/fonts/jetbrains-mono-latin-700-normal.woff2") format("woff2"); }
  @font-face { font-family: "JetBrains Mono"; font-weight: 500; src: url("assets/fonts/jetbrains-mono-latin-500-normal.woff2") format("woff2"); }

  :root {
    /* FEDSA mountain palette */
    --orange: #ea5424;
    --red: #dc3b1b;
    --yellow: #f2b81f;
    --blue: #2b96d6;
    --ink: #080a1c;
    --ink-2: #12163a;
    --white: #ffffff;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1280px; height: 720px; background: var(--ink); overflow: hidden; }

  .thumb {
    position: relative;
    width: 1280px;
    height: 720px;
    overflow: hidden;
    font-family: "Roboto", sans-serif;
    color: var(--white);
    background:
      radial-gradient(620px 520px at 1010px 420px, rgba(43,150,214,.55), transparent 70%),
      radial-gradient(520px 420px at 120px 40px, rgba(234,84,36,.30), transparent 70%),
      radial-gradient(420px 360px at 640px 760px, rgba(242,184,31,.18), transparent 70%),
      linear-gradient(160deg, #0d1030 0%, var(--ink) 60%);
  }

  /* faint grid, fading out towards the text */
  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,.06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.06) 1px, transparent 1px);
    background-size: 48px 48px;
    -webkit-mask-image: radial-gradient(700px 600px at 1000px 360px, #000 20%, transparent 75%);
            mask-image: radial-gradient(700px 600px at 1000px 360px, #000 20%, transparent 75%);
  }

  /* ---------- people ---------- */
  .person {
    position: absolute;
    bottom: 0;
    filter:
      drop-shadow(3px 0 0 #fff) drop-shadow(-3px 0 0 #fff)
      drop-shadow(0 3px 0 #fff) drop-shadow(0 -3px 0 #fff)
      drop-shadow(0 18px 30px rgba(0,0,0,.55));
  }
  .schalk { left: 676px; height: 770px; bottom: -150px; }
  .justin { left: 858px; height: 620px; bottom: -120px; }
  /* warm up the blue stage lighting a touch so skin tones read naturally */
  .schalk.person {
    filter:
      sepia(.14) saturate(1.12) brightness(1.04)
      drop-shadow(3px 0 0 #fff) drop-shadow(-3px 0 0 #fff)
      drop-shadow(0 3px 0 #fff) drop-shadow(0 -3px 0 #fff)
      drop-shadow(0 18px 30px rgba(0,0,0,.55));
  }

  /* ---------- copy ---------- */
  .copy {
    position: absolute;
    left: 56px;
    top: 56px;
    bottom: 52px;
    width: 740px;
    z-index: 3;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    justify-content: space-between;
  }

  .pill {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    padding: 10px 20px 10px 16px;
    border-radius: 999px;
    background: var(--blue);
    font-weight: 900;
    font-style: italic;
    font-size: 30px;
    letter-spacing: .02em;
    text-transform: uppercase;
    box-shadow: 0 8px 24px rgba(43,150,214,.45);
  }
  .pill svg { width: 30px; height: 30px; }

  .headline {
    margin-top: 6px;
    font-weight: 900;
    font-style: italic;
    text-transform: uppercase;
    line-height: .88;
    letter-spacing: -.02em;
  }
  .headline .l1 {
    display: block;
    font-size: 136px;
    text-shadow: 0 6px 0 rgba(0,0,0,.35);
  }

  /* "ZERO JS" with view-transition style ghost frames trailing behind it */
  .headline .l2 {
    position: relative;
    display: inline-block;
    white-space: nowrap;
    font-size: 178px;
    color: var(--yellow);
    text-shadow: 0 8px 0 rgba(0,0,0,.35);
  }
  .headline .l2 .ghost {
    position: absolute;
    left: 0; top: 0;
    z-index: -1;
    text-shadow: none;
  }
  .headline .l2 .g1 { color: var(--orange); opacity: .55; transform: translateX(-26px); }
  .headline .l2 .g2 { color: var(--red);    opacity: .30; transform: translateX(-52px); }

  .code {
    display: inline-flex;
    align-items: center;
    gap: 18px;
    padding: 16px 24px 16px 18px;
    border-radius: 16px;
    background: rgba(8,10,28,.88);
    border: 2px solid rgba(255,255,255,.14);
    box-shadow: 0 16px 36px rgba(0,0,0,.5);
    font-family: "JetBrains Mono", monospace;
    font-weight: 700;
    font-size: 30px;
    white-space: nowrap;
  }
  .code .tag {
    font-family: "Roboto", sans-serif;
    font-weight: 900;
    font-style: italic;
    font-size: 20px;
    letter-spacing: .04em;
    padding: 6px 10px;
    border-radius: 8px;
    background: var(--orange);
    color: #fff;
  }
  .code .at   { color: #ff7ab6; }
  .code .prop { color: #7fd1ff; }
  .code .val  { color: var(--yellow); }
  .code .p    { color: #9aa3c7; }


  /* ---------- FEDSA badge ---------- */
  .fedsa {
    position: absolute;
    right: 34px;
    top: 30px;
    z-index: 5;
    display: flex;
    align-items: center;
    padding: 12px 16px;
    border-radius: 16px;
    background: rgba(8,10,28,.72);
    border: 2px solid rgba(255,255,255,.14);
  }
  .fedsa img { height: 64px; display: block; }
</style>
</head>
<body>
  <div class="thumb">
    <div class="grid"></div>

    <img class="person schalk" src="assets/schalk-venter.png" alt="Schalk Venter">
    <img class="person justin" src="assets/justin-slack.png" alt="Justin Slack">

    <div class="copy">
      <div class="pill">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="2.5" y="4" width="9" height="16" rx="2"/>
          <rect x="14.5" y="4" width="7" height="16" rx="2" stroke-dasharray="3 3"/>
        </svg>
        CSS View Transitions
      </div>

      <h1 class="headline">
        <span class="l1">SPA Feel.</span>
        <span class="l2">
          <span class="ghost g2" aria-hidden="true">Zero JS</span>
          <span class="ghost g1" aria-hidden="true">Zero JS</span>
          Zero JS
        </span>
      </h1>

      <div class="code">
        <span class="tag">CSS</span>
        <span><span class="at">@view-transition</span> <span class="p">{</span> <span class="prop">navigation</span><span class="p">:</span> <span class="val">auto</span><span class="p">; }</span></span>
      </div>
    </div>


    <div class="fedsa"><img src="assets/fedsa-logo.png" alt="FEDSA"></div>
  </div>
</body>
</html>
