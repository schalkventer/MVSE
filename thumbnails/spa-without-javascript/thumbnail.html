<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CSS View Transitions in 30 Minutes — YouTube Thumbnail</title>
<style>
  @font-face { font-family: "Roboto"; font-weight: 900; font-style: italic; src: url("assets/fonts/roboto-latin-900-italic.woff2") format("woff2"); }
  @font-face { font-family: "Roboto"; font-weight: 900; font-style: normal; src: url("assets/fonts/roboto-latin-900-normal.woff2") format("woff2"); }
  @font-face { font-family: "Roboto"; font-weight: 700; font-style: normal; src: url("assets/fonts/roboto-latin-700-normal.woff2") format("woff2"); }

  :root {
    /* FEDSA mountain palette */
    --orange: #ea5424;
    --red: #dc3b1b;
    --yellow: #f2b81f;
    --blue: #2b96d6;
    --ink: #000000;
    --white: #ffffff;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1280px; height: 720px; background: var(--ink); overflow: hidden; }

  .thumb {
    position: relative;
    width: 1280px;
    height: 720px;
    overflow: hidden;
    font-family: "Roboto", sans-serif;
    color: var(--white);
    background: var(--ink);
  }

  /* ---------- speakers: square avatar + name tag ---------- */
  .speaker {
    position: absolute;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .avatar {
    position: relative;
    border-radius: 16px;
    overflow: hidden;
    box-shadow:
      0 0 0 7px var(--white),
      0 22px 44px rgba(0,0,0,.6);
  }
  .avatar img { position: absolute; display: block; }

  .name {
    position: relative;
    margin-top: -20px;
    padding: 7px 18px 8px;
    border-radius: 999px;
    background: var(--white);
    color: var(--ink);
    font-weight: 900;
    font-style: italic;
    font-size: 26px;
    letter-spacing: .01em;
    text-transform: uppercase;
    white-space: nowrap;
    box-shadow: 0 10px 24px rgba(0,0,0,.45);
  }

  .speaker.schalk { left: 946px; top: 50px; }
  .schalk .avatar {
    width: 270px; height: 270px;
    background: linear-gradient(160deg, #3aa6e6 0%, #1c5aa8 100%);
  }
  /* warm up the blue stage lighting a touch so skin tones read naturally */
  .schalk .avatar img {
    left: -9px; top: 11px; height: 536px;
    filter: sepia(.14) saturate(1.12) brightness(1.04);
  }

  .speaker.justin { left: 946px; top: 374px; }
  .justin .avatar {
    width: 270px; height: 270px;
    background: linear-gradient(160deg, #f07a3e 0%, #c7361a 100%);
  }
  /* the source photo is cropped at the shoulders, so it fills the square edge to edge */
  .justin .avatar img { left: 0; bottom: 0; width: 270px; }

  /* ---------- copy ---------- */
  .copy {
    position: absolute;
    left: 56px;
    top: 56px;
    bottom: 52px;
    width: 800px;
    z-index: 3;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    justify-content: center;
  }

  .headline {
    font-weight: 900;
    font-style: italic;
    text-transform: uppercase;
    line-height: .9;
    letter-spacing: -.02em;
  }
  .headline .l1 {
    display: block;
    font-size: 132px;
    text-shadow: 0 6px 0 rgba(0,0,0,.35);
  }

  /* "TRANSITIONS" with view-transition style ghost frames trailing behind it */
  .headline .l2 {
    position: relative;
    display: inline-block;
    white-space: nowrap;
    font-size: 132px;
    color: var(--yellow);
    text-shadow: 0 7px 0 rgba(0,0,0,.35);
  }
  .headline .l2 .ghost {
    position: absolute;
    left: 0; top: 0;
    z-index: -1;
    text-shadow: none;
  }
  .headline .l2 .g1 { color: var(--orange); opacity: .55; transform: translateX(-22px); }
  .headline .l2 .g2 { color: var(--red);    opacity: .30; transform: translateX(-44px); }

  .headline .l3 {
    display: block;
    margin-top: 18px;
    font-size: 84px;
    line-height: 1;
    white-space: nowrap;
    text-shadow: 0 5px 0 rgba(0,0,0,.35);
  }
  .headline .l3 .no {
    display: inline-block;
    padding: 0 14px 4px;
    margin-left: 4px;
    background: var(--white);
    color: #000;
    border-radius: 10px;
    text-shadow: none;
  }
</style>
</head>
<body>
  <div class="thumb">
    <div class="speaker schalk">
      <div class="avatar"><img src="assets/schalk-venter.png" alt=""></div>
      <div class="name">Schalk Venter</div>
    </div>
    <div class="speaker justin">
      <div class="avatar"><img src="assets/justin-slack.png" alt=""></div>
      <div class="name">Justin Slack</div>
    </div>

    <div class="copy">
      <h1 class="headline">
        <span class="l1">CSS View</span>
        <span class="l2">
          <span class="ghost g2" aria-hidden="true">Transitions</span>
          <span class="ghost g1" aria-hidden="true">Transitions</span>
          Transitions
        </span>
        <span class="l3">In <span class="no">30 Minutes</span></span>
      </h1>
    </div>
  </div>
</body>
</html>
